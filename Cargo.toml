# SPDX-License-Identifier: Apache-2.0
#
# This repo brings 100% of what it needs: the real HashiCorp Vault KV v2 client logic
# (secret-vault, crate busbar-secret-vault) and the thin dlopen ABI adapter that packages it as a
# busbar plugin (secret-vault-plugin, crate busbar-secret-vault-plugin) both live here, as a
# same-repo Cargo workspace — not split across this repo and busbarAI. Only busbar-api/
# busbar-plugin-sdk (and, for the adapter's dev-dependencies, busbar-plugin-loader/
# busbar-plugin-abi) still reach into a sibling busbarAI checkout, since those are core-engine
# contracts every plugin depends on the same way. Mirrors GetBusbar/auth-oidc's restructure
# (commit 1875b2f) exactly.
[workspace]
resolver = "2"
members = [
    "secret-vault",
    "secret-vault-plugin",
]
