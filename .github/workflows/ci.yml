# Calls the canonical plugin-ci reusable workflow (GetBusbar/busbar/.github/workflows/plugin-ci.yml)
# instead of hand-copying build/test/signoff steps here — see that file for what actually runs.
#
# `service: vault` stands up the Vault dev server the test suite binds against, the same thin
# `uses:` wrapper auth-oidc/store-sqlite/store-postgres/store-valkey use for their own services.
# No `extra_sibling_test_command`: busbarAI does not carry crates/hashicorp-vault or
# crates/hashicorp-vault-plugin in-tree, so this repo's own test suite, run above, is the
# real-Vault-backed proof.
#
# Pinned to busbar's `dev` branch (not the stale 1.5.0-dev branch, which predates the
# generic-credentials/store-schema redesign and the ScopeRef admission-topology generalization)
# — same convention store-mysql/store-postgres/store-valkey/store-sqlite/auth-oidc use.
name: ci

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]
  # Manual trigger. `gh run rerun` PINS the reusable-workflow SHA, so a fix landing in
  # core's plugin-ci.yml can only be picked up by a NEW run, never by rerunning an old one.
  workflow_dispatch: {}
jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@dev
    with:
      plugin_crate: busbar-hashicorp-vault-plugin
      plugin_kind: secret
      plugin_alias: vault
      service: vault
      busbar_ref: ${{ github.ref_name }} # same-branch: qa builds core qa, dev builds core dev (no stale main/tag)
